# Shared by every Spark process in the lab: master, worker, history server,
# and every driver Kyuubi launches (batch jobs and the SQL engine).
# Driver-only settings that only make sense inside the kyuubi container
# (spark.driver.host etc.) live in conf/kyuubi/kyuubi-defaults.conf.

# ---- cluster -------------------------------------------------------------
# spark.master is intentionally absent. Drivers launched by Kyuubi get it
# from the MASTER environment variable in the kyuubi container; see the
# comment in conf/kyuubi/kyuubi-defaults.conf for why.
spark.submit.deployMode              client
spark.driver.memory                  1g
spark.executor.memory                1g
spark.executor.cores                 1
# Standalone hands ALL free cores to the first app unless capped.
# Capping lets a batch job and the Kyuubi SQL engine run side by side.
spark.cores.max                      2

# ---- RustFS through s3a ---------------------------------------------------
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                     http://rustfs:9000
spark.hadoop.fs.s3a.endpoint.region              us-east-1
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.connection.ssl.enabled       false
spark.hadoop.fs.s3a.access.key                   rustfsadmin
spark.hadoop.fs.s3a.secret.key                   rustfsadmin123
spark.hadoop.fs.s3a.aws.credentials.provider     org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ---- Hive Metastore ------------------------------------------------------
spark.sql.catalogImplementation      hive
spark.hadoop.hive.metastore.uris     thrift://hive-metastore:9083
spark.sql.warehouse.dir              s3a://warehouse/

# ---- application Postgres (the "shop" DB, not the metastore DB) ----------
# Jobs read these with spark.conf.get(...). Custom keys must start with
# "spark." or Spark drops them. Override per job in the batch request.
spark.lab.pg.url                     jdbc:postgresql://postgres:5432/shop
spark.lab.pg.user                    app
spark.lab.pg.password                apppass

# ---- Kafka (jobs read it with spark.conf.get) ---------------------------
spark.lab.kafka.bootstrap            kafka:9092
spark.lab.stream.root                s3a://data/stream

# ---- lakehouse table locations ------------------------------------------
spark.lab.lake.root                  s3a://warehouse/lake

# ---- event logs -> history server ---------------------------------------
spark.eventLog.enabled               true
spark.eventLog.dir                   s3a://spark-logs/events
spark.history.fs.logDirectory        s3a://spark-logs/events
spark.history.fs.update.interval     10s
