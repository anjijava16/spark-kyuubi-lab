# ---------------------------------------------------------------
# Frontends: JDBC/Thrift for SQL (10009), REST for batch jobs (10099)
# ---------------------------------------------------------------
kyuubi.frontend.protocols                     THRIFT_BINARY,REST
kyuubi.frontend.bind.host                     0.0.0.0
kyuubi.frontend.thrift.binary.bind.port       10009
kyuubi.frontend.rest.bind.port                10099

# Lab only. Production would use LDAP, Kerberos or a custom authenticator.
kyuubi.authentication                         NONE

# ---------------------------------------------------------------
# SQL engine (what you get on the JDBC port)
# ---------------------------------------------------------------
kyuubi.engine.type                            SPARK_SQL
# one long-lived Spark app per user, shared by that user's sessions
kyuubi.engine.share.level                     USER
kyuubi.session.engine.idle.timeout            PT10M
kyuubi.session.engine.initialize.timeout      PT3M
# No engine jar setting needed: Kyuubi reads the Scala version off
# $SPARK_HOME/jars/spark-core_2.13-*.jar and uses
# $KYUUBI_HOME/externals/engines/spark/kyuubi-spark-sql-engine_2.13-<ver>.jar
# no Kerberos here, so skip --proxy-user impersonation
kyuubi.engine.doAs.enabled                    false

# ---------------------------------------------------------------
# WHERE IS spark.master?  Deliberately NOT here, and not in
# spark-defaults.conf either. The kyuubi container gets it as the
# environment variable MASTER=spark://spark-master:7077 (see
# docker-compose.yml), which spark-submit reads as its last fallback.
#
# Reason: Kyuubi 1.12 can only follow a batch to FINISHED/ERROR through
# YARN, Kubernetes, or - when it sees no master at all - by watching the
# local driver process with `jps`. A spark:// master matches none of
# them, and batches then stay PENDING forever even after they succeed.
# In client mode the driver IS a local process here, so the jps route
# gives correct states. On YARN you would set spark.master=yarn again.
# ---------------------------------------------------------------

# spark.* keys here are passed to the SQL engine's spark-submit.
# The engine's driver runs inside this container, so executors on the
# worker must call back to the hostname "kyuubi".
spark.driver.host                             kyuubi
spark.driver.bindAddress                      0.0.0.0

# ---------------------------------------------------------------
# Batch jobs (POST /api/v1/batches)
# Format: kyuubi.batchConf.<batchType>.<spark conf key>
# These are defaults; the conf in a batch request can override them.
# Never send spark.master in a batch request here (see above).
# ---------------------------------------------------------------
kyuubi.batchConf.spark.spark.submit.deployMode      client
kyuubi.batchConf.spark.spark.driver.host            kyuubi
kyuubi.batchConf.spark.spark.driver.bindAddress     0.0.0.0

kyuubi.batch.resource.upload.enabled          true
kyuubi.batch.session.idle.timeout             PT6H
